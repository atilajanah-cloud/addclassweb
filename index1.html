<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Seduh Nusantara - Official Links</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            500: '#b45309',
                            800: '#78350f',
                            900: '#451a03',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50/50 font-sans text-slate-800 min-h-screen flex justify-center py-10 px-4 selection:bg-amber-200">

    <main class="w-full max-w-md flex flex-col items-center">
        <!-- Profil UMKM -->
        <header class="mb-5 flex flex-col items-center text-center">
            <div class="relative w-24 h-24 mb-3 rounded-full border-4 border-white shadow-md overflow-hidden bg-amber-100 flex items-center justify-center text-4xl">
                ☕
            </div>
            
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-1.5">
                Kopi Seduh Nusantara
                <span class="text-amber-600 text-base" title="UMKM Terverifikasi">✓</span>
            </h1>
            
            <p class="text-sm text-slate-600 mt-1 max-w-xs">
                Roastery & Kedai Kopi Artisan lokal. Menyajikan biji kopi pilihan petani Nusantara 🌿
            </p>

            <!-- Fitur Nilai Plus: Indikator Jam Operasional Real-Time -->
            <div id="store-status" class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Buka Hari Ini (08.00 - 22.00)</span>
            </div>
        </header>

        <!-- Fitur Nilai Plus: Kategori Filter Tabs -->
        <nav aria-label="Filter Tautan" class="w-full mb-4">
            <div class="flex justify-center gap-1.5 p-1 bg-amber-100/70 rounded-xl text-xs font-semibold text-amber-900">
                <button class="filter-btn active flex-1 py-1.5 px-3 rounded-lg bg-white shadow-sm transition" data-category="all">Semua</button>
                <button class="filter-btn flex-1 py-1.5 px-3 rounded-lg hover:bg-white/60 transition" data-category="order">Pesan</button>
                <button class="filter-btn flex-1 py-1.5 px-3 rounded-lg hover:bg-white/60 transition" data-category="info">Info & Maps</button>
            </div>
        </nav>

        <!-- Daftar Tautan Dinamis via JS -->
        <section class="w-full">
            <ul id="link-list" class="space-y-3">
                <!-- Data tautan dirender melalui script.js -->
            </ul>
        </section>

        <!-- Footer -->
        <footer class="mt-10 text-center text-xs text-slate-400">
            <p class="font-medium text-slate-500">© 2026 Kopi Seduh Nusantara</p>
            <p class="mt-1">Dibuat untuk Final Project Web Development P1 - P4</p>
        </footer>
    </main>

    <script src="script1.js"></script>
</body>
</html>
